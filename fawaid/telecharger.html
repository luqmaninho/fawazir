<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Télécharger Fawaid</title>
  <meta name="robots" content="noindex">
  <script>
    // Sur iPhone, on part vers l'app App Store avant même d'afficher la page (les pubs Meta « Trafic » refusent un lien
    // App Store direct, d'où cette page). Même lien que plus bas : pt (jeton fournisseur) et ct (étiquette de campagne).
    (function () {
      var ua = navigator.userAgent || '';
      if (!(/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))) return;
      var ct = (new URLSearchParams(location.search).get('ct') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40);
      window.FAWAID_APPSTORE = 'https://apps.apple.com/app/id6834394816?pt=129739129&ct=' + (ct || 'site') + '&mt=8';
      window.FAWAID_PARTI = true;
      location.href = window.FAWAID_APPSTORE.replace(/^https:/, 'itms-apps:');
    })();
  </script>
  <meta name="theme-color" content="#060A1D">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; min-height: 100%; background: #060A1D; color: #F5EFE0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: grid; place-items: center; text-align: center; padding: 24px 16px; box-sizing: border-box; min-height: 100vh;
      background: radial-gradient(120% 60% at 50% 100%, #1D2456 0%, #0E1535 45%, #060A1D 100%); }
    img { width: 84px; height: 84px; border-radius: 20px; }
    h1 { font-size: 30px; margin: 14px 0 6px; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-weight: 400; }
    p { margin: 0 0 26px; color: #B9BEDA; }
    .liens { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .liens a { display: block; min-width: 220px; padding: 14px 20px; border-radius: 14px; background: #E6C27A; color: #10152F; font-weight: 800; text-decoration: none; }
    .liens span { color: #8E95BC; font-size: 14px; }
  </style>
</head>
<body>
  <div>
    <img src="apple-touch-icon.png" alt="">
    <h1 id="titre">Fawaid</h1>
    <p id="texte">Quoi que tu ressentes, l’islam a les mots.</p>
    <div class="liens">
      <a id="ios" href="https://apps.apple.com/app/id6834394816">App Store</a>
      <a id="android" href="https://play.google.com/store/apps/details?id=app.fawaid" hidden>Google Play</a>
      <span id="bientot">Bientôt sur Google Play</span>
    </div>
  </div>
  <script>
    // Lien des pubs Fawaid : envoie directement vers le bon magasin selon le téléphone. Le paramètre ct de l'adresse
    // (étiquette de campagne, par exemple ?ct=meta-fr) est transmis à l'App Store, qui compte les installations par
    // étiquette dans App Store Connect ; les utm_* sont transmis à Google Play (referrer).
    // ANDROID : passer à true quand l'app sera publiée sur Google Play.
    var ANDROID = false;
    (function () {
      var q = new URLSearchParams(location.search);
      var appStore = 'https://apps.apple.com/app/id6834394816';
      var ct = (q.get('ct') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40);
      // pt : jeton fournisseur du compte développeur (App Store Connect > Analytics > Campagnes), sans lui Apple ne compte pas ct.
      appStore += '?pt=129739129&ct=' + (ct || 'site') + '&mt=8';
      var utm = [];
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(function (k) {
        if (q.get(k)) utm.push(k + '=' + encodeURIComponent(q.get(k)));
      });
      var play = 'https://play.google.com/store/apps/details?id=app.fawaid';
      if (utm.length) play += '&referrer=' + encodeURIComponent(utm.join('&'));
      document.getElementById('ios').href = appStore;
      document.getElementById('android').href = play;
      if (ANDROID) { document.getElementById('android').hidden = false; document.getElementById('bientot').hidden = true; }

      var textes = {
        en: ['Fawaid', 'Whatever you feel, Islam has the words.', 'Coming soon on Google Play'],
        tr: ['Fawaid', 'Ne hissedersen hisset, İslam’ın sana bir sözü var.', 'Yakında Google Play’de'],
        ar: ['فوائد', 'مهما كان شعورك، فللإسلام كلمة لك.', 'قريبًا على Google Play']
      };
      var langue = (navigator.language || 'fr').slice(0, 2);
      if (textes[langue]) {
        document.documentElement.lang = langue;
        if (langue === 'ar') document.documentElement.dir = 'rtl';
        document.getElementById('titre').textContent = textes[langue][0];
        document.getElementById('texte').textContent = textes[langue][1];
        document.getElementById('bientot').textContent = textes[langue][2];
      }

      var ua = navigator.userAgent || '';
      if (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        // Les navigateurs intégrés (Instagram, Facebook, TikTok) affichent la version web de l'App Store au lieu d'ouvrir
        // l'app App Store : il faut encore un appui, et 93 % des clics Instagram se perdaient là (19/11/2026 : 211 clics,
        // 15 vues de la fiche). itms-apps ouvre directement l'app App Store, avec pt et ct (l'étiquette est gardée).
        // Secours : si rien ne s'ouvre en 1,5 s (schéma bloqué), on passe au lien web, comme avant.
        // L'ouverture est déjà lancée dans <head> (FAWAID_PARTI) ; ici, seulement le secours.
        var secours = setTimeout(function () { location.replace(appStore); }, 1500);
        document.addEventListener('visibilitychange', function () { if (document.hidden) clearTimeout(secours); });
        window.addEventListener('pagehide', function () { clearTimeout(secours); });
        if (!window.FAWAID_PARTI) location.href = appStore.replace(/^https:/, 'itms-apps:');
      }
      else if (ANDROID && /android/i.test(ua)) location.replace(play);
    })();
  </script>
</body>
</html>
